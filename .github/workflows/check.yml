# The codex in this repo says "done is what the gates return". This is that gate.
# scripts/check.py verifies the repo against its own claims: that the emitter runs and
# prints a real line, that the paste-ready block is plain text and matches CODEX.md
# byte for byte, that every quoted line exists in the pool, and that no link is dead.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:


concurrency:
  # Un push nuevo sobre la misma rama cancela el CI del anterior: sin esto, una
  # tanda de commits paga N ejecuciones y solo la última importa.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  check:
    # Runner propio: los self-hosted no consumen cuota de Actions («GitHub Actions usage is
    # free for self-hosted runners»), y el check lo sigue emitiendo Actions, que es lo que la
    # protección de rama exige (required_status_checks.checks[].app_id = 15368). Con
    # ubuntu-latest el job muere en 3 s por el bloqueo de facturación y la rama queda
    # incommiteable: no entra ni el arreglo que baja el consumo.
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check.py
