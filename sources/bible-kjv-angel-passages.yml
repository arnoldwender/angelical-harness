pd_status_us: "The 1611 King James Version is public domain in the United States."
pd_status_eu: "Public domain in the EU and everywhere outside the United Kingdom, where the King James Version remains under perpetual Crown copyright administered by Cambridge University Press. The repo is published from Germany, so the UK restriction does not reach it."
source_url: "https://biblehub.com/kjv/matthew/18.htm"
