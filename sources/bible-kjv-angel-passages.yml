# The scriptural references the axis epigraphs point at, checked so that the
# references themselves are known to be right even where the epigraph beside
# them is the repo's own prose rather than a quotation.
#
# Verified 2026-09-10 against the King James text:
#
#   Matthew 18:10  "Take heed that ye despise not one of these little ones; for
#     I say unto you, That in heaven their angels do always behold the face of
#     my Father which is in heaven."
#     Cited in CODEX.md beside the Guardian. Correct: this is the passage the
#     doctrine of the guardian angel rests on.
#
#   Daniel 12:1  "And at that time shall Michael stand up, the great prince
#     which standeth for the children of thy people..."
#     Cited beside Michael. Correct.
#
#   Luke 1:26-38  The annunciation, opening "And in the sixth month the angel
#     Gabriel was sent from God unto a city of Galilee, named Nazareth".
#     Cited beside Gabriel in CODEX.md. Correct as the pericope; the line the
#     repo prints next to it is its own descriptive prose, not a quotation from
#     it, which is why it is not in quotation marks and is not a finding.
#
#   Jude 9  Michael contending with the devil over the body of Moses. Cited
#     beside Michael. Correct.
#
# Nothing here was found wrong. The file exists because a reference that is
# right is worth recording as checked - "no finding" is a measurement, and a
# measurement nobody wrote down gets made again.
work: "Matthew 18:10, Daniel 12:1, Luke 1:26-38 and Jude 9, King James Version"
author: "Various - the evangelists Matthew and Luke, the Book of Daniel, and the Epistle of Jude"
author_born: "unknown - biblical authors, no datable birth"
author_died: "unknown - biblical authors, no datable death"
year: 1611
edition: "King James Version, 1611."
translator: "The translators of the King James Version, 1611"
