year: 1415
edition: "Attested in a manuscript of 1415 held at Metten Abbey, Bavaria, rediscovered there c. 1647; the initials appear on the medal from the 17th century onward."
pd_status_us: "A 15th-century anonymous Latin formula - public domain."
pd_status_eu: "Anonymous and medieval, five centuries beyond any term - public domain."
