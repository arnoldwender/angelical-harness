# "Quis ut Deus?" IS NOT IN ANY OF THE THREE VERSES CITED NEXT TO IT.
#
# CODEX.md and REFERENCE.md both print:
#
#   *"Quis ut Deus?" - "Who is like God?"* ... - Rev 12:7; Dan 12:1; Jude 1:9
#
# The three references are correct as the places where Michael appears in the
# canon: Revelation 12:7 ("And there was war in heaven: Michael and his angels
# fought against the dragon"), Daniel 12:1 (Michael the great prince) and
# Jude 9 (Michael contending with the devil over the body of Moses). Verified
# 2026-09-10 against the Wikisource King James text.
#
# But the Latin phrase is in none of them. "Quis ut Deus" is the literal Latin
# translation of the Hebrew name Michael, mi-ka-el, "who is like God" - a gloss
# of the name, not a line of scripture. It appears on Michael's shield in
# Western art and as the motto of the Bavarian Order of Saint Michael, founded
# 1693. Setting it in quotation marks immediately before a chapter-and-verse
# list reads as if the verses were its source. They are not.
#
# This is the smallest finding in the repo and the least likely to be caught,
# because everything in the line is individually true. It is recorded so that
# the epigraph can be read as what it is: a name being translated, followed by
# the passages about the one who bears it.
